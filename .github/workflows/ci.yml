name: CI/CD
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Hatch and Coverage
        run: pip install hatch hatch-vcs "coverage[toml]"
      - name: Run tests with coverage
        run: |
          hatch test --cover
          coverage xml
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
          format: cobertura
          github-token: ${{ secrets.GITHUB_TOKEN }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Hatch
        run: pip install hatch hatch-vcs
      - name: Build Sphinx documentation
        run: hatch run docs:build
  deploy-stable:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Hatch
        run: pip install hatch hatch-vcs
      - name: Build and deploy stable
        run: |
          hatch build
          echo "${GITHUB_REPOSITORY#*/} deployment on stable servers"
          ls -l dist/
  deploy-develop:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Hatch
        run: pip install hatch hatch-vcs
      - name: Build and deploy develop
        run: |
          hatch build
          echo "${GITHUB_REPOSITORY#*/} deployment on develop servers"
          ls -l dist/
